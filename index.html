<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Spotify sync: connect code</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #111214; color: #e6e6e6;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(560px, 92vw); padding: 28px; background: #1e1f22; border-radius: 14px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #b5bac1; }
  textarea {
    width: 100%; box-sizing: border-box; height: 120px; resize: none;
    padding: 12px; border: 1px solid #3a3c41; border-radius: 8px;
    background: #111214; color: #e6e6e6; font: 13px/1.4 ui-monospace, Consolas, monospace;
  }
  button {
    margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px;
    background: #23a55a; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  .note { margin-top: 16px; font-size: 13px; color: #80848e; }
  .error h1 { color: #f0b232; }
</style>
</head>
<body>
<main id="app">
  <h1>Loading…</h1>
</main>
<script>
  // This page never sends anything anywhere. It only reads the address bar and shows the code.
  const q = new URLSearchParams(location.search);
  const app = document.getElementById("app");
  const code = q.get("code"), state = q.get("state"), error = q.get("error");

  if (error) {
    app.className = "error";
    app.innerHTML = "<h1>Login cancelled</h1><p>Nothing was shared. You can close this tab.</p>";
  } else if (code && state) {
    app.innerHTML =
      "<h1>Copy your connect code</h1>" +
      "<p>Paste it into Discord with <b>Paste code</b>. It works once, for a few minutes.</p>" +
      '<textarea id="code" readonly></textarea>' +
      '<button id="copy">Copy code</button>' +
      '<p class="note">The code only works together with the bot\'s secret key, so it\'s useless to anyone else.</p>';
    const box = document.getElementById("code");
    box.value = state + "." + code;
    box.addEventListener("focus", () => box.select());
    document.getElementById("copy").addEventListener("click", async (e) => {
      try { await navigator.clipboard.writeText(box.value); }
      catch { box.select(); document.execCommand("copy"); }
      e.target.textContent = "Copied";
    });
    // Remove the code from the address bar and browser history.
    history.replaceState(null, "", location.pathname);
  } else {
    app.className = "error";
    app.innerHTML = "<h1>No code here</h1><p>Open this page by logging in from the Discord bot.</p>";
  }
</script>
</body>
</html>
